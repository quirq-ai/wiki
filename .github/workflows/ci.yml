# Pull-request checks for the generator itself. Does not commit wiki content.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "quirq_wiki/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . "pytest==9.1.1"
      - name: Pytest
        run: python -m pytest
      - name: Offline generate smoke
        run: |
          python -m quirq_wiki generate --help
          python -m quirq_wiki activity --help
          python -m quirq_wiki list-repos --repos-json tests/fixtures/repos.json
