# Pull-request checks for the generator itself. Does not commit wiki content.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "quirq_wiki/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
      - name: Offline generate smoke
        run: |
          python -m quirq_wiki generate --help
          python -m quirq_wiki activity --help
          python -m quirq_wiki list-repos --repos-json tests/fixtures/repos.json
