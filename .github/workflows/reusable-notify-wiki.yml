# Reusable notifier: source repos `uses:` this file on push to their default
# branch. It sends repository_dispatch `quirq-wiki-sync` to quirq-ai/wiki.
#
# GITHUB_TOKEN from the calling repository cannot dispatch into wiki. Pass an
# org secret `WIKI_DISPATCH_TOKEN` (fine-grained PAT or GitHub App token with
# Actions: write on quirq-ai/wiki).
#
# Caller:
#
#   name: Notify org wiki
#   on:
#     push:
#       branches: [main]
#   jobs:
#     notify:
#       uses: quirq-ai/wiki/.github/workflows/reusable-notify-wiki.yml@main
#       secrets:
#         token: ${{ secrets.WIKI_DISPATCH_TOKEN }}
#
# Inline equivalent (if you would rather not `uses:` a reusable workflow):
#
#   jobs:
#     notify:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/github-script@v7
#           with:
#             github-token: ${{ secrets.WIKI_DISPATCH_TOKEN }}
#             script: |
#               await github.rest.repos.createDispatchEvent({
#                 owner: 'quirq-ai',
#                 repo: 'wiki',
#                 event_type: 'quirq-wiki-sync',
#                 client_payload: {
#                   repo: context.repo.repo,
#                   ref: context.sha,
#                 },
#               })

name: Notify org wiki

on:
  workflow_call:
    inputs:
      wiki_owner:
        type: string
        required: false
        default: quirq-ai
      wiki_repo:
        type: string
        required: false
        default: wiki
    secrets:
      token:
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send quirq-wiki-sync dispatch
        uses: actions/github-script@v7
        env:
          WIKI_OWNER: ${{ inputs.wiki_owner }}
          WIKI_REPO: ${{ inputs.wiki_repo }}
        with:
          github-token: ${{ secrets.token }}
          script: |
            const owner = process.env.WIKI_OWNER;
            const repo = process.env.WIKI_REPO;
            const paths = new Set();
            const event = context.payload || {};
            const commits = event.commits || [];
            for (const commit of commits) {
              for (const p of commit.added || []) paths.add(p);
              for (const p of commit.removed || []) paths.add(p);
              for (const p of commit.modified || []) paths.add(p);
            }
            const changed_paths = [...paths].join(',');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'quirq-wiki-sync',
              client_payload: {
                repo: context.repo.repo,
                ref: context.sha,
                changed_paths,
              },
            });
            core.info(`Dispatched quirq-wiki-sync for ${context.repo.repo} (${paths.size} paths)`);
