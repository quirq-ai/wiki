name: Daily repository sizes

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

# Its own group, like activity-sync: it writes only _sizes/ and rebases before pushing.
concurrency:
  group: sizes-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e . "pytest==9.1.1"
          python -m pytest
      - name: Measure every public repository
        id: measure
        continue-on-error: true
        env:
          # Read-only API token; the push below uses its own.
          GITHUB_TOKEN: ${{ secrets.WIKI_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m quirq_wiki sizes --out .
      - name: Commit the snapshot
        if: steps.measure.outcome == 'success' || steps.measure.outcome == 'failure'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=${auth}" "$@"; }
          if [ ! -d _sizes ]; then exit 0; fi
          git add -- _sizes
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[wiki-bot] record repository sizes"
          for attempt in 1 2 3; do
            if git_auth pull --rebase origin main && git_auth push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed."
            sleep $((attempt * 10))
          done
          echo 'Could not push the snapshot; the next run measures again.'
          exit 1
      - name: Report an incomplete snapshot
        if: steps.measure.outcome == 'failure'
        run: |
          echo 'Some repositories could not be measured; the snapshot marks them and its totals as incomplete.'
          exit 1
