name: Daily activity index

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: Optional single public repository (empty for all public repos)
        required: false
        type: string
      since:
        description: Optional backfill start in UTC, e.g. 2026-10-01
        required: false
        type: string

# Its own group: sharing wiki-sync's would let one workflow cancel the other's
# pending run. The two write different paths and rebase before pushing.
concurrency:
  group: activity-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e . "pytest==9.1.1"
          python -m pytest
      - name: Collect public activity
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.WIKI_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          ACTIVITY_REPO: ${{ inputs.repo }}
          ACTIVITY_SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${ACTIVITY_REPO}" ]; then extra+=(--repo "${ACTIVITY_REPO}"); fi
          if [ -n "${ACTIVITY_SINCE}" ]; then extra+=(--since "${ACTIVITY_SINCE}"); fi
          python -m quirq_wiki activity --out . "${extra[@]}"
      - name: Commit completed batches and collection status
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Checkout keeps no credentials (persist-credentials: false), so the
          # write token reaches git only here, after third-party code has run.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=${auth}" "$@"; }
          if [ ! -d _activity ]; then exit 0; fi
          git add -- _activity
          git add -u -- INDEX.md ':(glob)*/_index.md'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[wiki-bot] batch public repository activity"
          # Another workflow may push to main meanwhile: rebase and retry.
          for attempt in 1 2 3; do
            if git_auth pull --rebase origin main && git_auth push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed."
            sleep $((attempt * 10))
          done
          echo 'Could not push the batch; state.json was not pushed, so the next run collects it again.'
          exit 1
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection was incomplete. Completed batches were saved; failed repository cursors were preserved.'
          exit 1
